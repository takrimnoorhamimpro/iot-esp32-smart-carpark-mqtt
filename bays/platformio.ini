; BAY CONTROLLER (the brain): bay sensors, LEDs, bookings.
[platformio]
; Windows only: keeps the build path short. Delete this line on Linux/macOS.
; core_dir = C:\pio

[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
